<style>
:root{
  --ink:#17222E;
  --sea:#E7ECEF;
  --land:#FFFFFF;
  --land-hi:#F3F1EC;
  --line:#2A3644;
  --paper:#F5F3EE;
  --muted:#6E7C8A;
  --stamp:#B5761A;
  --sheet:#FFFFFF;
  --radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Familjen Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--safe-t) + 12px) 16px 14px;
  background:linear-gradient(to bottom,rgba(245,243,238,.96) 45%,rgba(245,243,238,0));
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.brand{pointer-events:auto}
.brand h1{font-family:Syne,sans-serif;font-weight:800;font-size:20px;letter-spacing:.14em;margin:0;text-transform:uppercase}
.brand .sub{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.brand .sub b{color:var(--stamp);font-weight:500}
.iconbtn{pointer-events:auto;width:38px;height:38px;border-radius:11px;background:#fff;
  border:1px solid rgba(23,34,46,.14);display:grid;place-items:center;font-size:16px;
  box-shadow:0 1px 3px rgba(23,34,46,.08)}
.iconbtn:active{background:#EDEAE3}

/* ---------- map ---------- */
#mapwrap{position:absolute;inset:0}
#svg{width:100%;height:100%;display:block;touch-action:none}
.sea{fill:var(--sea)}
.grat{fill:none;stroke:rgba(23,34,46,.07);stroke-width:.5}
/* NIENTE fill qui: in SVG il CSS vince sull'attributo e coprirebbe i colori dei paesi */
.land{stroke:var(--line);stroke-width:.35;stroke-linejoin:round;transition:fill .5s ease}
.land.sub{stroke-width:.3;stroke:rgba(42,54,68,.55)}
.land.on{stroke:var(--line);stroke-width:.45}
.land.sel{stroke:#B5761A;stroke-width:1.3}
.fade-in{animation:fadein .8s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);z-index:20;
  display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:5px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(23,34,46,.12);border-radius:16px;box-shadow:0 4px 18px rgba(23,34,46,.12)}
.tab{padding:9px 2px 8px;border-radius:12px;text-align:center;font-size:9.5px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.tab .g{display:block;font-size:17px;margin-bottom:2px;line-height:1}
.tab.active{background:rgba(181,118,26,.14);color:var(--stamp)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:25;background:rgba(23,34,46,.35);opacity:0;pointer-events:none;
  transition:opacity .25s ease}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:86vh;
  background:var(--sheet);border-radius:22px 22px 0 0;border-top:1px solid rgba(23,34,46,.1);
  transform:translateY(102%);transition:transform .34s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;box-shadow:0 -14px 44px rgba(23,34,46,.22)}
.sheet.open{transform:translateY(0)}
.grip{width:44px;height:5px;border-radius:3px;background:rgba(23,34,46,.2);flex:none;
  margin:0 auto;position:relative;top:15px}
.sheet .grip{padding:0}
.sheet::before{content:"";display:block;height:34px;flex:none}
.closer{position:absolute;top:8px;right:10px;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;font-size:15px;color:var(--muted);background:#F5F3EE;z-index:2}
.closer:active{background:#E6E2D9}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px calc(var(--safe-b) + 92px)}
.sheet h2{font-family:Syne,sans-serif;font-weight:800;font-size:24px;margin:6px 0 2px;letter-spacing:-.01em}
.sheet h3{font-family:Syne,sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:22px 0 10px}

/* signature: the stamp header */
.stamp{position:relative;margin:10px 0 4px;padding:16px 18px 14px;border-radius:8px;
  border:1.5px dashed rgba(181,118,26,.6);background:rgba(181,118,26,.07)}
.stamp .code{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--stamp);letter-spacing:.14em;text-transform:uppercase}
.stamp h2{margin:4px 0 0}
.stamp .coord{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);margin-top:6px}
.stamp .seal{position:absolute;top:12px;right:14px;text-align:center;font-family:"DM Mono",monospace;
  color:var(--stamp);line-height:1}
.stamp .seal .n{font-size:30px;font-weight:500}
.stamp .seal .l{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cell{background:#F5F3EE;border:1px solid rgba(23,34,46,.09);border-radius:12px;padding:10px 11px}
.cell .n{font-family:"DM Mono",monospace;font-size:20px}
.cell .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
  background:#F5F3EE;border:1px solid rgba(23,34,46,.12);font-size:13px}
.chip .c{font-family:"DM Mono",monospace;font-size:11px;color:var(--stamp)}
.chip.solo{opacity:.62}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(23,34,46,.09)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);text-align:right;flex:none}
.del{color:#C63F6B;font-size:13px;padding:6px}

label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=date],input[type=number],select{width:100%;padding:12px 13px;border-radius:12px;
  background:#F5F3EE;border:1px solid rgba(23,34,46,.14);outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--stamp)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--stamp);color:#FFF;
  font-weight:600;text-align:center;margin-top:16px;letter-spacing:.02em}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#F5F3EE;color:var(--ink);border:1px solid rgba(23,34,46,.16)}
.btn.small{padding:11px;font-size:14px;margin-top:10px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.hint b{color:var(--paper);font-weight:600}
ol.steps{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.6}
ol.steps b{color:var(--paper)}
.pick{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.pfilter{margin-top:10px}
.pick .chip.on{background:rgba(181,118,26,.16);border-color:var(--stamp);color:var(--ink)}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px;margin-top:10px}
.face{display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px}
.face .pic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-family:Syne,sans-serif;font-weight:600;font-size:17px;color:#fff;letter-spacing:.02em;
  background-size:cover;background-position:center;border:2px solid transparent;
  box-shadow:0 1px 4px rgba(23,34,46,.16);transition:border-color .15s ease,transform .15s ease}
.face .nm{font-size:11px;color:var(--muted);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face.on .pic{border-color:var(--stamp);transform:scale(1.04)}
.face.on .nm{color:var(--ink);font-weight:600}
.face.add .pic{background:#F5F3EE;color:var(--muted);border:1.5px dashed rgba(23,34,46,.25);font-size:20px}
.personhead{display:flex;align-items:center;gap:14px}
.bigface{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:#fff;font-family:Syne,sans-serif;font-weight:600;font-size:22px;
  background-size:cover;background-position:center;box-shadow:0 2px 8px rgba(23,34,46,.2)}
.mini{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;
  color:#fff;background-size:cover;background-position:center;margin:-2px 2px -2px -5px;flex:none}
.rub{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(23,34,46,.08)}
.rub .pic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-size:13px;font-weight:600;background-size:cover;background-position:center;flex:none}
.rub .nm{flex:1;font-size:14px}
.rub button{font-size:12px;color:var(--stamp);padding:6px 8px}
.searchres{max-height:180px;overflow-y:auto;margin-top:8px;border:1px solid rgba(23,34,46,.12);border-radius:12px}
.searchres div{padding:10px 12px;border-bottom:1px solid rgba(23,34,46,.08);font-size:14px}
.searchres div:last-child{border-bottom:0}
.legend{display:flex;align-items:center;gap:8px;font-family:"DM Mono",monospace;font-size:10px;color:var(--muted);margin-top:12px}
.legend .bar{flex:1;height:8px;border-radius:4px;border:1px solid rgba(23,34,46,.15);
  background:linear-gradient(90deg,#FFF,#9FC2D6 35%,#4E88AC 70%,#1F5F86)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px;line-height:1.6}

/* toast */
#filterbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 62px);z-index:22;
  display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;
  background:#17222E;color:#F5F3EE;font-size:13px;box-shadow:0 3px 14px rgba(23,34,46,.28)}
#filterbar .x{opacity:.6;font-size:11px;margin-left:2px}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translate(-50%,20px);z-index:60;
  background:#17222E;color:#F5F3EE;padding:11px 16px;border-radius:12px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .25s ease;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--paper);text-align:center;
  transition:opacity .5s ease}
#boot .t{font-family:Syne,sans-serif;font-weight:800;letter-spacing:.2em;font-size:15px;text-transform:uppercase}
#boot .s{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

   1. archivio locale (IndexedDB) — niente esce dal telefono
   ========================================================= */
const DB = (() => {
  let p;
  function open(){
    if(p) return p;
    p = new Promise((res,rej)=>{
      const r = indexedDB.open("atlante",1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return p;
  }
  return {
    async get(k){ const db=await open(); return new Promise((res,rej)=>{
      const t=db.transaction("kv","readonly").objectStore("kv").get(k);
      t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); },
    async set(k,v){ const db=await open(); return new Promise((res,rej)=>{
      const t=db.transaction("kv","readwrite").objectStore("kv").put(v,k);
      t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
  };
})();

function toast(msg,ms=2600){ const t=$("#toast"); t.textContent=msg; t.classList.add("on");

function fmtDate(iso){ const d=new Date(iso); return d.getDate()+" "+MESI[d.getMonth()].slice(0,3)+" "+d.getFullYear(); }
function fmtRange(a,b){
  if(!a) return "senza data";
  if(!b) return fmtDate(a);
  const d1=new Date(a), d2=new Date(b);
  if(a===b) return fmtDate(a);
  if(d1.getMonth()===d2.getMonth() && d1.getFullYear()===d2.getFullYear())
    return d1.getDate()+"–"+d2.getDate()+" "+MESI[d1.getMonth()]+" "+d1.getFullYear();
  return fmtDate(a)+" → "+fmtDate(b);
}
const days = t => t.start ? Math.max(1, Math.round((new Date(t.end||t.start)-new Date(t.start))/864e5)+1) : 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const HUES = ["#C4453F","#D2762B","#C9A227","#7C9130","#3F8F63","#1F8F86","#2E7BA6",
              "#3D5FA8","#6E5AA8","#8E4FA8","#A8437A","#B0562A","#5D9B4A","#4F7C9E"];
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

/* a ogni paese il suo colore, ma due paesi vicini non possono avere la stessa tinta */
let COLOR = new Map(), CENT = new Map();
function centroidOf(k,id){
  const key=k+":"+id; let c=CENT.get(key);
  if(!c){ const f=index.find(x=>x.k===k&&x.id===id); c = f ? d3.geoCentroid(f.feat) : [0,0]; CENT.set(key,c); }
  return c;
}
function assignColors(){
  COLOR = new Map();
  const list = [...stats.values()].filter(e=>e.k==="c"||e.k==="us")
    .sort((a,b)=>(a.k+":"+a.id).localeCompare(b.k+":"+b.id));
  const placed = [];
  list.forEach(e=>{
    const key = e.k+":"+e.id, cen = centroidOf(e.k,e.id), start = hash(key)%HUES.length;
    const vicini = placed.filter(p=>d3.geoDistance(p.cen,cen) <= 0.55);
    let chosen = HUES[start], bestScore = -1;
    for(let i=0;i<HUES.length;i++){
      const cand = HUES[(start+i)%HUES.length], hc = d3.hcl(cand).h;
      let score = 999;                                   // distanza dal vicino più simile
      vicini.forEach(p=>{
        let d = Math.abs(d3.hcl(p.col).h - hc); if(d>180) d = 360-d;
        if(d < score) score = d;
      });
      if(score >= 45){ chosen = cand; break; }           // abbastanza diverso: basta così
      if(score > bestScore){ bestScore = score; chosen = cand; }
    }
    placed.push({cen, col:chosen});
    COLOR.set(key, chosen);
  });
}
function baseColor(k,id){ return COLOR.get(k+":"+id) || HUES[hash(k+":"+id)%HUES.length]; }
/** più visite = colore più pieno (1 volta = tinta tenue) */
function shade(k,id,visits){
  const t = Math.min(1, (visits-1)/9);
  return d3.interpolateLab("#FFFFFF", baseColor(k,id))(0.38 + 0.62*t);
}

   4. geografia (confini inclusi nel file: funziona offline)
   ========================================================= */
function bbox(f){ const b=d3.geoBounds(f); return [b[0][0],b[0][1],b[1][0],b[1][1]]; }

function buildGeo(){
  const geo = JSON.parse(document.getElementById("geodata").textContent);
  feats.world = geo.w.features.map(f=>({k:"c", id:String(f.id), name:itName(f.properties.n), feat:f, bbox:bbox(f)}));
  feats.us    = geo.u.features.map(f=>({k:"us", id:String(f.id), name:f.properties.n, feat:f, bbox:bbox(f)}));
  feats.it    = [];
  index = feats.world.concat(feats.us);
  buildCities();
}

/* ---- città: elenco compatto + griglia per la ricerca del più vicino ---- */
let cities = [], cgrid = new Map();
function buildCities(){
  const raw = document.getElementById("citydata").textContent;
  raw.split("\n").forEach(line=>{
    if(!line) return;
    const p = line.split("|");
    const c = {n:p[0], lat:+p[1]/100, lon:+p[2]/100, b:+p[3]};
    const i = cities.push(c)-1;
    const key = Math.floor(c.lat)+"/"+Math.floor(c.lon);
    let cell = cgrid.get(key); if(!cell) cgrid.set(key, cell=[]);
    cell.push(i);
  });
}
const RAD = [15, 22, 30, 45];       // km entro cui una foto "appartiene" alla città
function km(lat1,lon1,lat2,lon2){
  const dy = (lat2-lat1)*111.2;
  const dx = (lon2-lon1)*111.2*Math.cos((lat1+lat2)/2*Math.PI/180);
  return Math.sqrt(dx*dx+dy*dy);
}
function nearestCity(lon,lat){
  let best=null, bestD=1e9;
  const y=Math.floor(lat), x=Math.floor(lon);
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const cell = cgrid.get((y+dy)+"/"+(x+dx)); if(!cell) continue;
    for(const i of cell){
      const c = cities[i];
      const d = km(lat,lon,c.lat,c.lon);
      if(d>RAD[c.b]) continue;
      const w = d*(1-0.14*c.b);        // a parità di distanza vince la città più grande
      if(w<bestD){ bestD=w; best=c; }
    }
  }
  return best;
}
const cityId = c => c.n+"@"+Math.round(c.lat*100)+","+Math.round(c.lon*100);
const cityLonLat = id => { const [la,lo]=id.split("@")[1].split(",").map(Number); return [lo/100, la/100]; };

/* =========================================================
   5. dove sono queste coordinate?
   ========================================================= */
function inBox(b, lon, lat){
  const wrap = b[0] > b[2];                      // paesi a cavallo dell'antimeridiano
  const lonOk = wrap ? (lon>=b[0]-.2 || lon<=b[2]+.2) : (lon>=b[0]-.2 && lon<=b[2]+.2);
  return lonOk && lat>=b[1]-.2 && lat<=b[3]+.2;
}
function hit(list, lon, lat){
  for(const f of list){
    if(!inBox(f.bbox,lon,lat)) continue;
    if(d3.geoContains(f.feat,[lon,lat])) return f;
  }
  return null;
}
/* foto scattate in barca, in spiaggia o su isolotti fuori carta:
   allargo la ricerca a cerchi via via più larghi (fino a ~45 km) */
const RINGS = [0, .15, .4];
function findIn(list, lon, lat){
  for(const r of RINGS){
    if(r===0){ const f=hit(list,lon,lat); if(f) return f; continue; }
    for(let a=0;a<8;a++){
      const t=a*Math.PI/4;
      const f = hit(list, lon + r*Math.cos(t)/Math.max(.2,Math.cos(lat*Math.PI/180)), lat + r*Math.sin(t));
      if(f) return f;
    }
  }
  return null;
}
/** ritorna [{k,id,name}] per un punto: paese, regione/stato, città più vicina */
function placesOf(lon,lat){
  const out=[];
  const c = findIn(feats.world, lon, lat);
  if(!c) return out;
  out.push({k:"c",id:c.id,name:c.name});
  if(c.id===US_ID){ const s=findIn(feats.us,lon,lat); if(s) out.push({k:"us",id:s.id,name:s.name}); }
  const city = nearestCity(lon,lat);
  if(city) out.push({k:"city", id:cityId(city), name:city.n, p:c.id});
  return out;
}

/* =========================================================
   6. aggregazione: quante volte, con chi
   ========================================================= */
function recompute(){
  stats = new Map();
  activeTrips().forEach(t=>{
    const dd = days(t);
    (t.places||[]).forEach(p=>{
      const key = p.k+":"+p.id;
      let e = stats.get(key);
      if(!e){ e={k:p.k,id:p.id,name:p.name,p:p.p,visits:0,days:0,photos:0,people:new Map(),trips:[]}; stats.set(key,e); }
      e.visits++; e.days+=dd; e.photos+=(t.photos||0); e.trips.push(t);
      (t.people||[]).forEach(n=>e.people.set(n,(e.people.get(n)||0)+1));
    });
  });
  assignColors();
  paint();
  const nc = [...stats.values()].filter(e=>e.k==="c").length;
  const nu = [...stats.values()].filter(e=>e.k==="us").length;
  const nk = [...stats.values()].filter(e=>e.k==="city").length;
  $("#counter").innerHTML = (filterPerson ? `insieme a <b>${esc(filterPerson)}</b> · ` : "")
    + `<b>${nc}</b>${filterPerson?"":"/195"} paesi · <b>${nk}</b> città · <b>${nu}</b>/50 stati usa`;
  $("#filterbar").style.display = filterPerson ? "flex" : "none";
}

}

/* =========================================================
   7. mappa
   ========================================================= */
function fillFor(f){
  const e = stats.get(f.k+":"+f.id);
  if(e) return shade(f.k, f.id, e.visits);
  if(f.k==="us"){
    // stato mai visitato: tengo il colore degli Stati Uniti, solo un po' più chiaro,
    // altrimenti aprendo gli stati l'America diventerebbe tutta bianca
    const usa = stats.get("c:"+US_ID);
    if(usa) return d3.interpolateLab(shade("c",US_ID,usa.visits), "#FFFFFF")(0.45);
  }
  return "#FFFFFF";
}
function cityDots(){
  return [...stats.values()].filter(e=>e.k==="city").map(e=>{
    const [lon,lat] = cityLonLat(e.id);
    return {k:"city", id:e.id, name:e.name, lon, lat, visits:e.visits,
            feat:{type:"Point", coordinates:[lon,lat]}};
  }).sort((a,b)=>a.visits-b.visits);
}
function paint(){
  if(!gRoot) return;
  gRoot.select("g.states").style("display", showUS?null:"none");
  gRoot.selectAll("path.land").attr("fill", d=>fillFor(d))
    .classed("on", d=>!!stats.get(d.k+":"+d.id));
  const k = (d3.zoomTransform(svg.node())||{k:1}).k;
  const g = gRoot.select("g.cities");
  const dots = cityDots();
  // etichette: solo quelle che non si pestano i piedi al livello di zoom attuale
  const shown = [];
  const labels = k>=2.2 ? dots.slice().sort((a,b)=>b.visits-a.visits).filter(d=>{
    const p = projection([d.lon,d.lat]);
    const ok = !shown.some(q=>Math.abs(q[0]-p[0])*k<46 && Math.abs(q[1]-p[1])*k<16);
    if(ok) shown.push(p);
    return ok;
  }) : [];
  g.selectAll("circle").data(dots, d=>d.id).join("circle")
    .attr("cx", d=>projection([d.lon,d.lat])[0])
    .attr("cy", d=>projection([d.lon,d.lat])[1])
    .attr("r", 2.6/k).attr("fill", "#17222E").attr("fill-opacity",.9)
    .attr("stroke","#FFFFFF").attr("stroke-width",1.1/k)
    .style("cursor","pointer")
    .on("click",(e,d)=>{ e.stopPropagation(); openPlace(d); });
  g.selectAll("text").data(labels, d=>d.id).join("text")
    .attr("x", d=>projection([d.lon,d.lat])[0])
    .attr("y", d=>projection([d.lon,d.lat])[1] - 5/k)
    .attr("text-anchor","middle").attr("fill","#17222E").attr("fill-opacity",.9)
    .attr("stroke","#FFFFFF").attr("stroke-width",2.5/k).attr("paint-order","stroke")
    .style("font-size",(9/k)+"px").style("font-family",'"DM Mono",monospace')
    .text(d=>d.name);
}
function drawMap(){
  const el = $("#mapwrap"), W = el.clientWidth, H = el.clientHeight;
  projection = d3.geoNaturalEarth1().fitExtent([[8,H*0.14],[W-8,H*0.86]], {type:"Sphere"});
  path = d3.geoPath(projection);
  svg = d3.select("#svg").attr("viewBox",`0 0 ${W} ${H}`);
  svg.selectAll("*").remove();
  gRoot = svg.append("g");

  gRoot.append("path").attr("class","sea").attr("d", path({type:"Sphere"}));
  gRoot.append("path").attr("class","grat").attr("d", path(d3.geoGraticule10()));

  const g1 = gRoot.append("g");
  g1.selectAll("path").data(feats.world).join("path")
    .attr("class","land").attr("d", d=>path(d.feat)).attr("fill",d=>fillFor(d))
    .on("click", (e,d)=>openPlace(d));

  const g2 = gRoot.append("g").attr("class","states").style("display", showUS?null:"none");
  g2.selectAll("path").data(feats.us).join("path")
    .attr("class","land sub").attr("d", d=>path(d.feat)).attr("fill",d=>fillFor(d))
    .on("click", (e,d)=>{ e.stopPropagation(); openPlace(d); });

  gRoot.append("g").attr("class","cities");

  zoom = d3.zoom().scaleExtent([1,64]).on("zoom", ev=>{
    gRoot.attr("transform", ev.transform);
    gRoot.selectAll("path.land").attr("stroke-width", d=> (d.k==="c"?0.35:0.22)/ev.transform.k);
    gRoot.select(".grat").attr("stroke-width", .5/ev.transform.k);
    const k = ev.transform.k;
    gRoot.selectAll("g.cities circle").attr("r",2.6/k).attr("stroke-width",1/k);
    clearTimeout(window.__lab);
    window.__lab = setTimeout(paint, 90);        // ricalcolo le etichette a zoom fermo
  });
  svg.call(zoom);
  gRoot.classed("fade-in", true);
}
function flyTo(f){
  const el0=$("#mapwrap");
  if(f.feat && f.feat.type==="Point"){
    const [px,py] = projection(f.feat.coordinates), k=7;
    const t = d3.zoomIdentity.translate(el0.clientWidth/2, el0.clientHeight*0.34).scale(k).translate(-px,-py);
    return svg.transition().duration(650).call(zoom.transform, t);
  }
  const [[x0,y0],[x1,y1]] = path.bounds(f.feat);
  const el=$("#mapwrap"), W=el.clientWidth, H=el.clientHeight;
  const k = Math.min(9, 0.55/Math.max((x1-x0)/W,(y1-y0)/(H*0.55)));
  const t = d3.zoomIdentity.translate(W/2,H*0.34).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2);
  svg.transition().duration(650).call(zoom.transform, t);
}

/* --- dettaglio di un luogo (il "timbro") --- */
function openPlace(f){
  selected = f;
  gRoot.selectAll("path.land").classed("sel", d=>d===f);
  const e = stats.get(f.k+":"+f.id);
  const c = d3.geoCentroid(f.feat);
  const coord = `${Math.abs(c[1]).toFixed(1)}°${c[1]>=0?"N":"S"}  ${Math.abs(c[0]).toFixed(1)}°${c[0]>=0?"E":"O"}`;
  const kind = f.k==="c" ? "Paese" : f.k==="us" ? "Stato · USA" : "Città";

  let h = `<div class="stamp">
      <div class="code">${kind}</div>
      <h2>${esc(f.name)}</h2>
      <div class="coord">${coord}</div>
      ${e?`<div class="seal"><div class="n">${e.visits}</div><div class="l">${e.visits===1?"volta":"volte"}</div></div>`:""}
    </div>`;

  const addBtn = `<button class="btn ghost small" onclick="panelAdd('${f.k}','${esc(f.id).replace(/'/g,"\\'")}')">${
      e ? "Aggiungi un'altra visita" : "Aggiungi un viaggio qui"}</button>`;
  const nUS = [...stats.values()].filter(x=>x.k==="us").length;
  const usaBtn = f.k==="c" && f.id===US_ID
    ? `<button class="btn${e?" ghost":""} small" onclick="toggleStates()">${
        showUS ? "Nascondi gli stati" : `Vedi gli stati · ${nUS}/50`}</button>` : "";
  if(!e){
    h += `<div class="empty">Non ci sei ancora stato.<br>Oppure il viaggio non è ancora in archivio.</div>`
       + usaBtn + addBtn;
    return openSheet(h);
  }

  const dated = e.trips.filter(t=>t.start);
  const first = dated.length ? dated.reduce((a,b)=> a.start<b.start?a:b) : null;
  const last  = dated.length ? dated.reduce((a,b)=> a.start>b.start?a:b) : null;
  h += `<div class="grid3">
      <div class="cell"><div class="n">${e.days||"—"}</div><div class="l">giorni</div></div>
      <div class="cell"><div class="n">${first?new Date(first.start).getFullYear():"—"}</div><div class="l">la prima volta</div></div>
      <div class="cell"><div class="n">${last?new Date(last.start).getFullYear():"—"}</div><div class="l">l'ultima</div></div>
    </div>`;

  if(f.k==="c" || f.k==="us"){
    const inHere = [...stats.values()].filter(x=>x.k==="city" && (
        f.k==="c" ? x.p===f.id : x.p===US_ID && insideFeat(f, x.id)))
      .sort((a,b)=>b.visits-a.visits || a.name.localeCompare(b.name));
    if(inHere.length) h += `<h3>Città</h3><div class="chips">` + inHere.map(x=>
      `<span class="chip" onclick="openCity('${esc(x.id).replace(/'/g,"\\'")}')">${esc(x.name)}${
        x.visits>1?`<span class="c">${x.visits}×</span>`:""}</span>`).join("") + `</div>`;
  }

  const ppl = [...e.people.entries()].sort((a,b)=>b[1]-a[1]);
  if(ppl.length){
    h += `<h3>Con chi</h3><div class="chips">` + ppl.map(([n,c2])=>
      `<span class="chip${c2===1?" solo":""}" onclick="openPersonRef(${nref(n)})">${miniFace(n)}${esc(n)}<span class="c">${c2}×</span></span>`).join("") + `</div>`;
  }
  h += `<h3>${e.visits} ${e.visits===1?"viaggio":"viaggi"}</h3>`;
  h += `<p class="hint">Tocca un viaggio per modificarlo.</p>`
    + tripRows(e.trips.slice().sort((a,b)=>(b.start||"").localeCompare(a.start||"")));
  h += usaBtn + addBtn;
  openSheet(h);
  flyTo(f);
}

window.toggleStates = () => {
  showUS = !showUS;
  paint();
  const usa = feats.world.find(f=>f.id===US_ID);
  if(showUS && usa){ closeSheet(); flyTo(usa); toast("Tocca uno stato per vedere i dettagli"); }
  else openPlace(usa);
};
function insideFeat(f, cid){ const ll = cityLonLat(cid); return d3.geoContains(f.feat, ll); }
window.openCity = id => {
  const e = stats.get("city:"+id); if(!e) return;
  const [lon,lat] = cityLonLat(id);
  openPlace({k:"city", id, name:e.name, lon, lat, feat:{type:"Point", coordinates:[lon,lat]}});
};

/* --- scheda di una persona --- */
window.openPersonRef = i => openPerson(NREF[i]);
function openPerson(name){
  const mine = trips.filter(t=>(t.people||[]).includes(name))
    .sort((a,b)=>(b.start||"").localeCompare(a.start||""));
  const paesi = new Map(), citta = new Map();
  mine.forEach(t=>(t.places||[]).forEach(p=>{
    if(p.k==="c") paesi.set(p.id, p.name);
    if(p.k==="city") citta.set(p.id, p.name);
  }));
  const gg = mine.reduce((a,t)=>a+days(t),0);
  const altri = new Map();
  mine.forEach(t=>t.people.forEach(n=>{ if(n!==name) altri.set(n,(altri.get(n)||0)+1); }));

  let h = `<div class="stamp personhead">
      <span class="bigface" style="${picStyle(name)}" onclick="setFaceByName(${nref(name)})">${
        avatars[name] ? "" : esc(initials(name))}</span>
      <div><div class="code">Compagno di viaggio</div><h2>${esc(name)}</h2>
      <div class="coord">${mine.length} ${mine.length===1?"viaggio":"viaggi"} insieme</div></div>
    </div>
    <div class="grid3">

function tripText(t){

    +" "+(t.start||"")).toLowerCase();
}
function panelTrips(q){

  faceTarget = name; if(!faceTarget) return;
  let inp = $("#faceInput");
  if(!inp){
    inp = document.createElement("input");
    inp.type="file"; inp.accept="image/*"; inp.id="faceInput"; inp.style.display="none";
    document.body.appendChild(inp);
    inp.onchange = async e => {
      const f = e.target.files[0]; if(!f||!faceTarget) return;
      try{ avatars[faceTarget] = await squareThumb(f); await save(); openPerson(faceTarget); toast("Foto salvata"); }
      catch(err){ toast("Questa immagine non va"); }

    };
  }

function squareThumb(file){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 128, c = document.createElement("canvas");
      c.width=S; c.height=S;
      const m = Math.min(img.width,img.height);
      c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

function autoName(places,start){
  if(!start){
    const c0 = places.filter(p=>p.k==="city").map(p=>p.name);
    const m0 = places.filter(p=>p.k==="c").map(p=>p.name);
    return ((c0.length?c0:m0).slice(0,3).join(", ") || "Viaggio") + " · senza data";
  }
  const city = places.filter(p=>p.k==="city").map(p=>p.name);
  const sub  = places.filter(p=>p.k==="us").map(p=>p.name);
  const main = places.filter(p=>p.k==="c").map(p=>p.name);
  const label = (city.length?city:sub.length?sub:main).slice(0,3).join(", ") || "Viaggio";
  const d = new Date(start);
  return label + " · " + MESI[d.getMonth()] + " " + d.getFullYear();
}

/* ---- lettore universale: Timeline di Google, libreria Foto del Mac, Takeout ---- */
function toMs(v){
  if(v==null) return 0;
  if(typeof v==="number") return v>1e12 ? v : v>1e9 ? v*1000 : 0;
  if(typeof v!=="string") return 0;
  if(/^\d+$/.test(v)){ const n=+v; return n>1e12 ? n : n>1e9 ? n*1000 : 0; }
  const t = Date.parse(v);
  return isNaN(t) ? 0 : t;
}
function pickTime(o){
  if(o.photoTakenTime && o.photoTakenTime.timestamp) return toMs(o.photoTakenTime.timestamp);
  for(const k of ["startTime","date","time","timestamp","timestampMs","endTime","startTimestamp","creation_date"]){
    if(o[k]!=null && typeof o[k]!=="object"){ const t=toMs(o[k]); if(t) return t; }
  }
  if(o.duration && o.duration.startTimestamp) return toMs(o.duration.startTimestamp);
  return 0;
}
const DEG = /(-?\d+\.\d+)[°\s]*,\s*(-?\d+\.\d+)/;
function parseLL(v){
  if(typeof v==="string"){ const m = v.replace(/^geo:/,"").match(DEG); return m ? [+m[1],+m[2]] : null; }
  if(!v || typeof v!=="object") return null;
  if(typeof v.latitudeE7==="number") return [v.latitudeE7/1e7, v.longitudeE7/1e7];
  if(typeof v.latitude==="number" && typeof v.longitude==="number") return [v.latitude, v.longitude];
  return null;
}
function pickLatLng(o){
  let ll = parseLL(o);
  if(!ll) for(const k of ["latLng","point","placeLocation","location","geoData","geoDataExif","center"]){
    if(o[k]!=null){ ll = parseLL(o[k]); if(ll) break; }
  }
  if(!ll) return null;
  const [lat,lon] = ll;
  if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180) return null;
  if(Math.abs(lat)<0.02 && Math.abs(lon)<0.02) return null;      // 0,0 = "posizione assente"
  return [lat,lon];
}
const IGNOTO = /^[_\s]*(unknown|sconosciut[oa]|senza nome|no name)[_\s]*$/i;
function pickPeople(o){
  const src = o.people || o.persons;
  if(!Array.isArray(src)) return [];
  return src.map(p=> typeof p==="string" ? p : (p && p.name) || "")
            .filter(n=> n && !IGNOTO.test(n));
}
/** percorre qualsiasi struttura e raccoglie {t, lat, lon, people} */
function harvest(node, inh, out){
  if(!node || typeof node!=="object" || out.length>60000) return;
  if(Array.isArray(node)){ for(const n of node) harvest(n, inh, out); return; }
  const t = pickTime(node) || inh;
  const ll = pickLatLng(node);
  const ppl = pickPeople(node);
  ppl.forEach(n=>SEEN.add(n));
  if(t && ppl.length && DATED.length<200000) DATED.push({t, people:ppl});
  if(ll && t) out.push({t, lat:ll[0], lon:ll[1], people:ppl});
  for(const k in node){ const v=node[k]; if(v && typeof v==="object") harvest(v, t, out); }
}
/** la Timeline registra un punto ogni pochi minuti: tengo solo i movimenti veri */
function thin(samples){
  samples.sort((a,b)=>a.t-b.t);
  const out=[]; let last=null;
  for(const s of samples){
    if(last && s.t-last.t < 216e5 && km(last.lat,last.lon,s.lat,s.lon) < 5){
      last.people = [...new Set(last.people.concat(s.people))];
      continue;
    }
    out.push(s); last=s;
  }
  return out;
}
function awayFromHome(samples){
  const h = settings.home;
  if(!h) return samples;
  return samples.filter(s => km(s.lat,s.lon,h.lat,h.lon) > 60);
}

async function importTakeout(files){

/* legge un singolo zip in streaming */
async function readZip(file, samples, onCount){
  const prog = $("#prog");
  let seen = 0;
  await new Promise((resolve,reject)=>{
    const unz = new fflate.Unzip();
    unz.register(fflate.UnzipInflate);
    let pending = 0, ended = false;
    const done = () => { if(ended && pending===0) resolve(); };
    unz.onfile = f => {
      if(!/\.json$/i.test(f.name)) return;                    // le foto non le tocco
      if(/(metadata|print-subscriptions|shared_album|user-generated)/i.test(f.name)) return;
      pending++;
      const chunks=[]; let len=0;
      f.ondata = (err,chunk,final)=>{
        if(err){ pending--; return done(); }
        if(chunk){ chunks.push(chunk); len+=chunk.length; }
        if(final){
          try{
            const buf=new Uint8Array(len); let o=0; chunks.forEach(c=>{buf.set(c,o);o+=c.length;});
            const j=JSON.parse(new TextDecoder().decode(buf));
            const s=fromTakeout(j); if(s) samples.push(s);
            if(++seen%200===0 && prog) prog.textContent = seen+" foto lette · "+samples.length+" con posizione";
          }catch(_){}
          pending--; done();
        }
      };
      f.start();
    };
    (async()=>{
      try{
        const rd = file.stream().getReader();
        for(;;){ const {done:d,value} = await rd.read(); if(d) break; unz.push(value,false); }
        unz.push(new Uint8Array(0), true);
        ended = true; done();
      }catch(err){ reject(err); }
    })();
  }).catch(err=>{ toast("Non riesco a leggere "+file.name); console.error(err); });
  if(onCount) onCount(seen);
}

function fromTakeout(j){
  if(!j || !j.photoTakenTime) return null;
  const g = j.geoData && j.geoData.latitude ? j.geoData
          : (j.geoDataExif && j.geoDataExif.latitude ? j.geoDataExif : null);
  if(!g || (!g.latitude && !g.longitude)) return null;
  const ts = +j.photoTakenTime.timestamp * 1000;
  if(!ts) return null;
  const people = Array.isArray(j.people) ? j.people.map(p=>p.name).filter(Boolean) : [];
  people.forEach(n=>SEEN.add(n));
  return { t: ts, lon: g.longitude, lat: g.latitude, people };
}

/** raggruppa i punti in viaggi, risolve i luoghi, aggiorna l'archivio */
function finishImport(samples, src, origin){
  const prog = $("#prog"); if(prog) prog.textContent = "capisco dove sei stato…";
  // prima capisco dove sta ogni punto, poi butto via l'Italia se non la vuoi
  const cache = new Map();
  const pts0 = [];
  samples.forEach(s=>{
    const key = s.lat.toFixed(1)+","+s.lon.toFixed(1);
    let pl = cache.get(key);
    if(!pl){ pl = placesOf(s.lon,s.lat); cache.set(key,pl); }
    if(!pl.length) return;
    if(settings.skipIT!==false && pl[0].id===IT_ID) return;
    pts0.push({t:s.t, lat:s.lat, lon:s.lon, people:s.people, pl});
  });
  if(!pts0.length){
    return openSheet(`<h2>Niente da segnare</h2><div class="empty">
      Tutti i punti sono in Italia o vicino a casa.<br>
      Se vuoi anche i viaggi italiani, togli l'esclusione in Importa.</div>
      <button class="btn" onclick="panelImport()">Torna a Importa</button>`);
  }
  pts0.sort((a,b)=>a.t-b.t);
  const gapMs = settings.gap*864e5;
  const groups=[]; let cur=[pts0[0]];
  for(let i=1;i<pts0.length;i++){
    if(pts0[i].t - cur[cur.length-1].t > gapMs){ groups.push(cur); cur=[pts0[i]]; }
    else cur.push(pts0[i]);
  }
  groups.push(cur);

  const made = [];
  groups.forEach(g=>{
    const pmap = new Map(), people = new Map();
    const pts = [];
    g.forEach(s=>{
      s.pl.forEach(p=>pmap.set(p.k+":"+p.id,p));
      s.people.forEach(n=>people.set(n,(people.get(n)||0)+1));
      if(pts.length<400) pts.push([+s.lon.toFixed(3),+s.lat.toFixed(3)]);
    });
    if(!pmap.size) return;
    const soglia = Math.max(1, settings.minPhotos||3);
    let chi = [...people.entries()].filter(([,c])=>c>=soglia).map(([n])=>n);
    if(!chi.length && people.size===1 && [...people.values()][0]>=Math.ceil(soglia/2))
      chi = [...people.keys()];                 // viaggio con pochissime foto: non essere troppo severo
    const places=[...pmap.values()];
    const start=new Date(g[0].t).toISOString().slice(0,10);
    const end=new Date(g[g.length-1].t).toISOString().slice(0,10);
    made.push({id:uid(), name:autoName(places,start), start, end,
      people:chi, places, photos:g.length, points:pts, manual:false, src});
  });

  made.forEach(t=>t.people.forEach(n=>SEEN.add(n)));
  SEEN.forEach(n=>{ if(!roster.includes(n)) roster.push(n); });
  const old = trips.filter(t=>t.src===src).length;
  const apply = mode => {
    if(mode==="replace"){                       // non buttare via i nomi scritti a mano
      trips.filter(t=>t.src===src && t.pinned && t.people.length).forEach(o=>{
        const m = o.start && made.find(n=> n.start<=o.end && n.end>=o.start);
        if(m){ m.people = [...new Set(m.people.concat(o.people))]; m.pinned = true; }
      });
    }
    trips = (mode==="replace" ? trips.filter(t=>t.src!==src) : trips).concat(made);
    save().then(()=>{ recompute(); done(); });
  };
  const done = () => {
    const paesi = new Set(made.flatMap(t=>t.places.filter(p=>p.k==="c").map(p=>p.id))).size;
    const pers  = new Set(made.flatMap(t=>t.people)).size;
    openSheet(`<h2>Fatto</h2>
      <div class="grid3">
        <div class="cell"><div class="n">${made.length}</div><div class="l">viaggi</div></div>
        <div class="cell"><div class="n">${paesi}</div><div class="l">paesi</div></div>
        <div class="cell"><div class="n">${pers}</div><div class="l">persone</div></div>
      </div>
      <p class="hint">Importati da ${origin}. Tocca un viaggio nell'archivio per aggiungere chi c'era.</p>
      <button class="btn" onclick="closeSheet()">Vedi la mappa</button>
      <button class="btn ghost small" onclick="panelTrips()">Apri l'archivio</button>`);
  };

  if(!old) return apply("replace");
  window.__apply = apply;
  openSheet(`<h2>${made.length} viaggi trovati</h2>
    <p class="hint">Nell'archivio ci sono già <b>${old} viaggi</b> importati da ${origin}.</p>
    <button class="btn" onclick="__apply('replace')">Sostituisci i vecchi</button>
    <button class="btn ghost" onclick="__apply('merge')">Aggiungili agli altri</button>
    <p class="hint">Scegli <b>Aggiungili</b> solo se questo è un pezzo nuovo della libreria,
    altrimenti ti ritrovi gli stessi viaggi due volte.</p>`);
}

/** attacca le persone ai viaggi esistenti in base alle date, senza toccare i luoghi */
function assignPeopleOnly(){
  const soglia = Math.max(1, settings.minPhotos||3);
  const dated = trips.filter(t=>t.start);
  if(!dated.length) return openSheet(`<h2>Nessun viaggio con data</h2><div class="empty">

  const conteggi = dated.map(()=>new Map());
  DATED.forEach(d=>{
    for(let i=0;i<dated.length;i++){
      const t = dated[i];
      const a = Date.parse(t.start), b = Date.parse(t.end||t.start) + 864e5;
      if(d.t>=a && d.t<=b){ d.people.forEach(n=>conteggi[i].set(n,(conteggi[i].get(n)||0)+1)); break; }
    }

    const chi = [...conteggi[i].entries()].filter(([,c])=>c>=soglia).map(([n])=>n)
      .filter(n=>!t.people.includes(n));
    if(!chi.length) return;
    t.people = t.people.concat(chi); t.pinned = true; toccati++; aggiunti += chi.length;
  });
  SEEN.forEach(n=>{ if(!roster.includes(n)) roster.push(n); });
  save().then(()=>{
    recompute();
    openSheet(`<h2>Persone assegnate</h2>
      <div class="grid3">

        <div class="cell"><div class="n">${roster.length}</div><div class="l">in rubrica</div></div>

  });
}

/* legge Timeline / export del Mac / qualsiasi json con coordinate */
function collectFaces(j){
  const src = Array.isArray(j) ? (j[0] && j[0].faces) : (j && j.faces);
  if(!src || typeof src!=="object") return 0;
  let n=0;
  for(const name in src){
    const v = src[name];
    if(typeof v==="string" && v.startsWith("data:image") && !avatars[name] && !IGNOTO.test(name)){
      avatars[name] = v; n++;
    }
    if(!roster.includes(name) && !IGNOTO.test(name)) roster.push(name);
  }
  return n;
}
async function importData(files){
  openSheet(`<h2>Leggo i dati</h2><div class="empty" id="prog">apro il file…</div>`);

  DATED = [];
  for(let i=0;i<files.length;i++){
    const f = files[i];

      }else{

        const j = JSON.parse(await f.text());

  if(!raw.length) return openSheet(`<h2>Niente da leggere</h2><div class="empty">

  if(faces){ await save(); toast(faces+" facce importate"); }

}

/* estrae il testo dei .json dentro uno zip, saltando tutto il resto */
async function readZipText(file, out){
  if(typeof fflate==="undefined"){ toast("Manca la libreria zip"); return; }
  await new Promise((resolve,reject)=>{
    const unz = new fflate.Unzip(); unz.register(fflate.UnzipInflate);
    let pending=0, ended=false;
    const done = () => { if(ended && pending===0) resolve(); };
    unz.onfile = f => {
      if(!/\.json$/i.test(f.name)) return;
      pending++;
      const chunks=[]; let len=0, over=false;
      f.ondata = (err,chunk,final)=>{
        if(err){ pending--; return done(); }
        if(chunk && !over){ len+=chunk.length; if(len>120e6){ over=true; } else chunks.push(chunk); }
        if(final){
          if(!over){
            const buf=new Uint8Array(len); let o=0; chunks.forEach(c=>{buf.set(c,o);o+=c.length;});
            out.push(new TextDecoder().decode(buf));
          }
          pending--; done();
        }
      };
      f.start();
    };
    (async()=>{ try{
      const rd = file.stream().getReader();
      for(;;){ const {done:d,value} = await rd.read(); if(d) break; unz.push(value,false); }
      unz.push(new Uint8Array(0), true); ended=true; done();
    }catch(e){ reject(e); } })();
  }).catch(e=>{ console.error(e); toast("Zip illeggibile"); });
}

/* --- backup --- */
function download(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
}
window.exportJSON = () => {
  download(new Blob([JSON.stringify({trips,settings},null,1)],{type:"application/json"}),
    "atlante-"+new Date().toISOString().slice(0,10)+".json");
  toast("Archivio salvato");
};
async function importJSON(file){
  try{
    const j = JSON.parse(await file.text());
    if(!Array.isArray(j.trips)) throw 0;
    trips = j.trips; if(j.settings) settings = Object.assign(settings,j.settings);
    await save(); recompute(); closeSheet(); toast(trips.length+" viaggi ricaricati");
  }catch(e){ toast("Questo file non è un archivio di Atlante"); }
}

/* =========================================================
   10. esportazione della mappa
   ========================================================= */
function panelExport(){
  openSheet(`<h2>Esporta la mappa</h2>
    <label>Titolo</label>
    <input type="text" id="mt" value="${esc(settings.title)}">
    <label>Formato</label>
    <select id="fmt">
      <option value="png4">PNG · 4000 px (stampa)</option>
      <option value="png2">PNG · 2000 px (schermo)</option>
      <option value="svg">SVG vettoriale (qualità infinita)</option>
    </select>
    <div class="legend"><span>1 volta</span><span class="bar"></span><span>10+</span></div>
    <button class="btn" onclick="doExport()">Crea l'immagine</button>
    <p class="hint">Il PNG grande è pronto per la stampa. L'SVG si ingrandisce quanto vuoi senza perdere nulla:
    è quello da portare in tipografia o da ritoccare.</p>`);
}
function exportSVG(W){
  const H = Math.round(W*0.56);
  const proj = d3.geoNaturalEarth1().fitExtent([[W*.04,H*.17],[W*.96,H*.93]], {type:"Sphere"});
  const p = d3.geoPath(proj);
  const nc = [...stats.values()].filter(e=>e.k==="c").length;
  const nt = trips.length;
  const sw = W/2400;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  s += `<rect width="${W}" height="${H}" fill="#F5F3EE"/>`;
  s += `<path d="${p({type:"Sphere"})}" fill="#E7ECEF"/>`;
  s += `<path d="${p(d3.geoGraticule10())}" fill="none" stroke="rgba(23,34,46,.09)" stroke-width="${sw}"/>`;
  const draw = f => `<path d="${p(f.feat)}" fill="${fillFor(f)}" stroke="#2A3644" stroke-width="${sw*1.15}"/>`;
  feats.world.forEach(f=> s+=draw(f));
  if(showUS) feats.us.forEach(f=> s+=draw(f));
  cityDots().forEach(d=>{
    const q = proj([d.lon,d.lat]); if(!q) return;
    s += `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${(W*.0016).toFixed(2)}"
          fill="#17222E" fill-opacity=".9" stroke="#FFFFFF" stroke-width="${sw*.9}"/>`;
  });
  const F = 'font-family="Helvetica Neue,Helvetica,Arial,sans-serif"';
  s += `<text x="${W*.04}" y="${H*.105}" ${F} font-size="${W*.036}" font-weight="700"
        letter-spacing="${W*.004}" fill="#17222E">${esc(settings.title).toUpperCase()}</text>`;
  s += `<text x="${W*.04}" y="${H*.145}" ${F} font-size="${W*.0125}" letter-spacing="${W*.002}"
        fill="#6E7C8A">${nc} PAESI · ${[...stats.values()].filter(e=>e.k==="city").length} CITTÀ · ${nt} VIAGGI · ${trips.reduce((a,t)=>a+days(t),0)} GIORNI</text>`;
  const bx=W*.04, by=H*.965;
  [1,3,5,7,10].forEach((v,i)=>{
    s += `<rect x="${bx+i*W*.018}" y="${by-W*.011}" width="${W*.016}" height="${W*.011}" rx="${W*.002}"
          fill="${d3.interpolateLab("#FFFFFF","#4E7089")(0.38+0.62*Math.min(1,(v-1)/9))}" stroke="#2A3644" stroke-width="${sw*.6}"/>`;
  });
  s += `<text x="${bx+W*.098}" y="${by}" ${F} font-size="${W*.0105}" fill="#6E7C8A">DA 1 A 10+ VISITE NELLO STESSO PAESE</text>`;
  return s + `</svg>`;
}
window.doExport = async () => {
  const t=$("#mt").value.trim(); if(t){ settings.title=t; save(); }
  const fmt=$("#fmt").value;
  toast("Preparo l'immagine…",4000);
  await new Promise(r=>setTimeout(r,60));
  if(fmt==="svg"){
    download(new Blob([exportSVG(2400)],{type:"image/svg+xml"}), "atlante.svg");
    return toast("SVG salvato");
  }
  const W = fmt==="png4" ? 4000 : 2000;
  const svgStr = exportSVG(W);
  const img = new Image();
  const url = URL.createObjectURL(new Blob([svgStr],{type:"image/svg+xml"}));
  img.onload = () => {
    const c=document.createElement("canvas");
    c.width=W; c.height=Math.round(W*0.56);
    const ctx=c.getContext("2d");
    ctx.fillStyle="#F5F3EE"; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>{ download(b,"atlante-"+W+".png"); toast("Immagine salvata"); },"image/png");
  };
  img.onerror = () => toast("Non sono riuscito a creare il PNG: prova l'SVG");
  img.src = url;
};

(async function boot(){
  try{
    trips = (await DB.get("trips")) || [];
    trips.forEach(t=>{ if(t.places) t.places = t.places.filter(p=>p.k!=="it"); });
    roster = (await DB.get("roster")) || [];
    avatars = (await DB.get("avatars")) || {};
    const s = await DB.get("settings"); if(s) settings = Object.assign(settings,s);
  }catch(_){}
  try{
    buildGeo();
  }catch(e){
    $("#bootMsg").innerHTML = "La mappa non si è aperta.<br>Riscarica il file e riprova.";
    return;
  }
  drawMap();
  recompute();
  const b=$("#boot"); b.style.opacity=0; setTimeout(()=>b.remove(),500);
  if(!trips.length) setTimeout(()=>toast("Mappa vuota: parti da Importa",4000),900);
})();
